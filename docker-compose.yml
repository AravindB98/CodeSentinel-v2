# Local / on-prem single-node deployment.
#   docker compose up --build
# Set ANTHROPIC_API_KEY in a .env file to enable AI review; omit it to run the
# deterministic offline engine. Set CODESENTINEL_API_KEYS for authenticated API.
services:
  codesentinel:
    build: .
    image: codesentinel:latest
    ports:
      - "8080:8080"
    environment:
      CODESENTINEL_API_KEYS: ${CODESENTINEL_API_KEYS:-}
      CODESENTINEL_LICENSE_KEY: ${CODESENTINEL_LICENSE_KEY:-}
      CODESENTINEL_LICENSE_PUBKEY: ${CODESENTINEL_LICENSE_PUBKEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CODESENTINEL_MOCK_LLM: ${CODESENTINEL_MOCK_LLM:-}
      CODESENTINEL_LOG_FORMAT: json
      CODESENTINEL_AUDIT_LOG: /data/audit/codesentinel-audit.log
    volumes:
      - audit:/data/audit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  audit:
