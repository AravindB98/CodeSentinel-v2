{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codesentinel.fullname" . }}-secrets
  labels: {{- include "codesentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  api-keys: {{ .Values.secrets.apiKeys | quote }}
  license-key: {{ .Values.secrets.licenseKey | quote }}
  license-public-key: {{ .Values.secrets.licensePublicKey | quote }}
{{- end -}}
