name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build RAG index
        run: python -m codesentinel.rag.ingest
      - name: Lint (ruff)
        run: ruff check codesentinel/ tests/
      - name: Type check (mypy)
        run: mypy codesentinel/ || true   # advisory until fully annotated
      - name: Tests
        env:
          CODESENTINEL_MOCK_LLM: "1"
        run: pytest tests/ -q --cov=codesentinel --cov-report=term-missing
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
